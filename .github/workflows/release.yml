name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate version and changelog only
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          if [[ "$REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
            tool/android_release.sh --dry-run --tag "$REF_NAME"
          elif [[ "$DRY_RUN" == true ]]; then
            tool/android_release.sh --dry-run
          else
            echo "Select a release tag to build a signed release." >&2
            exit 1
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}

  signed:
    if: github.ref_type == 'tag' && inputs.dry_run != true
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: android-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "$TAG" <<<"$releases"; then
            echo "A release already exists for $TAG. Review it before retrying." >&2
            exit 1
          fi
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - run: tool/verify.sh
      - name: Build and verify signed artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH
          ANDROID_KEYSTORE_PATH=$(mktemp "$RUNNER_TEMP/keystore-XXXXXX")
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Configure the ANDROID_KEYSTORE_BASE64 environment secret." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          tool/android_release.sh --tag "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feishin-remote-symbols-${{ github.ref_name }}
          path: build/symbols/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release-${{ github.ref_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --title "Feishin Remote $TAG" \
            --notes-file dist/release/RELEASE_NOTES.md dist/release/*
