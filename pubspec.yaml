name: feishin_remote
description: "Android remote control for a running Feishin music player."
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  audio_service: ^0.18.19
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
